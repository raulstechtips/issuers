{{- if .Values.cloudflareToken.enabled }}
{{- $inf := .Values.infisical }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: cloudflare-token-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "issuers-wrapper.labels" . | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required when cloudflareToken.enabled is true" $inf.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required when cloudflareToken.enabled is true" $inf.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when cloudflareToken.enabled is true" $inf.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required when cloudflareToken.enabled is true" $inf.environmentSlug | quote }}
      secretPath: {{ $inf.secretPath | quote }}
      recursive: {{ $inf.recursive }}
  targets:
    - name: cloudflare-token-secret
      namespace: {{ .Release.Namespace }}
      kind: Secret
      secretType: Opaque
      # Keep the existing Secret if this sync resource is removed.
      creationPolicy: Orphan
      metadata:
        labels: {}
        annotations: {}
      template:
        engineVersion: v1
        data:
          cloudflare-token: {{ "{{ .CLOUDFLARE_API_TOKEN.Value }}" | quote }}
{{- end }}
