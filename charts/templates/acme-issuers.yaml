{{- if .Values.acme.enabled }}
{{- $email := required "acme.email is required when acme.enabled is true" .Values.acme.email }}
{{- if not .Values.acme.dnsZones }}
{{- fail "acme.dnsZones is required when acme.enabled is true" }}
{{- end }}
{{- $zones := .Values.acme.dnsZones }}
{{- range .Values.acme.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .name }}
spec:
  acme:
    server: {{ .server | quote }}
    email: {{ $email | quote }}
    privateKeySecretRef:
      name: {{ .name }}
    solvers:
      - dns01:
          cloudflare:
            email: {{ $email | quote }}
            apiTokenSecretRef:
              name: cloudflare-token-secret
              key: cloudflare-token
        selector:
          dnsZones:
            {{- toYaml $zones | nindent 12 }}
{{- end }}
{{- end }}
