suite: Cloudflare token sync
templates:
  - templates/cloudflare-token-secret.yaml
release:
  name: issuers
  namespace: cert-manager
tests:
  - it: leaves token sync off without environment values
    asserts:
      - hasDocuments:
          count: 0
  - it: syncs the original key from the original Infisical source
    values: [../ci/all-on-values.yaml]
    asserts:
      - isAPIVersion:
          of: secrets.infisical.com/v1beta1
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: cloudflare-token-secret
      - equal:
          path: spec.infisicalAuthRef
          value: {name: fake-universal-auth, namespace: fake-auth}
      - equal:
          path: spec.sources
          value:
            - projectSlug: fake-project
              environmentSlug: fake-environment
              secretPath: /argocd/apps/env
              recursive: true
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.targets[0]
          value:
            name: cloudflare-token-secret
            namespace: cert-manager
            kind: Secret
            secretType: Opaque
            creationPolicy: Orphan
            metadata:
              labels: {}
              annotations: {}
            template:
              engineVersion: v1
              data:
                cloudflare-token: "{{ .CLOUDFLARE_API_TOKEN.Value }}"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: issuers
