suite: Internal CA issuer
templates:
  - templates/ca-issuer.yaml
tests:
  - it: leaves the environment dependent CA off by default
    asserts:
      - hasDocuments:
          count: 0
  - it: references the supplied CA key pair without creating it
    values: [../ci/all-on-values.yaml]
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterIssuer
      - equal:
          path: metadata.name
          value: fake-internal-ca-issuer
      - equal:
          path: spec.ca.secretName
          value: fake-internal-ca-key-pair
