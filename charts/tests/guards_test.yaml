suite: Required environment settings and strict schema
templates:
  - templates/acme-issuers.yaml
  - templates/ca-issuer.yaml
  - templates/cloudflare-token-secret.yaml
tests:
  - it: requires the ACME email
    template: templates/acme-issuers.yaml
    set:
      acme.enabled: true
      acme.dnsZones: [example.test]
    asserts:
      - failedTemplate:
          errorMessage: acme.email is required when acme.enabled is true
  - it: requires the ACME DNS zones
    template: templates/acme-issuers.yaml
    set:
      acme.enabled: true
      acme.email: fake-admin@example.test
    asserts:
      - failedTemplate:
          errorMessage: acme.dnsZones is required when acme.enabled is true
  - it: requires the CA key pair Secret name
    template: templates/ca-issuer.yaml
    set:
      ca.enabled: true
      ca.secretName: ""
    asserts:
      - failedTemplate:
          errorMessage: ca.secretName is required when ca.enabled is true
  - it: requires the Infisical auth name
    template: templates/cloudflare-token-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      infisical.authRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.name is required when cloudflareToken.enabled is true
  - it: requires the Infisical auth namespace
    template: templates/cloudflare-token-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      infisical.authRef.namespace: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.namespace is required when cloudflareToken.enabled is true
  - it: requires the Infisical project
    template: templates/cloudflare-token-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      infisical.projectSlug: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.projectSlug is required when cloudflareToken.enabled is true
  - it: requires the Infisical environment
    template: templates/cloudflare-token-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      infisical.environmentSlug: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.environmentSlug is required when cloudflareToken.enabled is true
  - it: rejects unknown wrapper keys
    template: templates/acme-issuers.yaml
    set:
      acme.unknown: true
    asserts:
      - failedTemplate:
          errorMessage: |
            values don't meet the specifications of the schema(s) in the following chart(s):
            issuers:
            - acme: Additional property unknown is not allowed
  - it: rejects quoted booleans
    template: templates/acme-issuers.yaml
    set:
      acme.enabled: "true"
    asserts:
      - failedTemplate:
          errorMessage: |
            values don't meet the specifications of the schema(s) in the following chart(s):
            issuers:
            - acme.enabled: Invalid type. Expected: boolean, given: string
